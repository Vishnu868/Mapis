services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    environment:
      MAPIS_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./artifacts:/app/artifacts:ro
      - mapis_db:/app/db
    ports: ["8000:8000"]
    depends_on: [redis]
volumes:
  mapis_db:
